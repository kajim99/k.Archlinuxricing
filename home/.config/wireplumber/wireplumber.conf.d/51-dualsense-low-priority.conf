# DualSense (USB or Bluetooth) never becomes the default audio output/input by itself (2026-11-08).
# Its speaker/jack and mic still show up, so they can be picked by hand in pavucontrol-qt.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-Sony_Interactive_Entertainment_*" }
      { node.name = "~alsa_input.usb-Sony_Interactive_Entertainment_*" }
    ]
    actions = {
      update-props = {
        priority.session = 1
        priority.driver = 1
      }
    }
  }
]

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "~bluez_card.*", device.product.id = "0x0ce6" }
      { node.name = "~bluez_*", device.description = "~*DualSense*" }
    ]
    actions = {
      update-props = {
        priority.session = 1
        priority.driver = 1
      }
    }
  }
]
