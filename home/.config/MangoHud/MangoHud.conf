# Phone-only FPS (2026-11-19): HUD fully transparent (no_display would stop logging), FPS logged live to CSV
# for phonebox-sync -> PhoneBox "GAME" card. Shift_R+F12 toggles the HUD if it ever shows.
legacy_layout=0
fps
alpha=0
background_alpha=0
autostart_log=1
log_interval=500
output_folder=/home/kareem/.local/state/mangohud

# Steam/Heroic start with MANGOHUD=1 so their games log FPS; skip the launchers themselves (2026-11-19)
blacklist=steam,steamwebhelper,heroic,gldriverquery,vulkandriverquery,steam-runtime-check-requirements,pressure-vessel-wrap
